apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedo-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pedo-frontend
  template:
    metadata:
      labels:
        app: pedo-frontend
    spec:
      containers:
      - name: frontend
        image: saurabhkv/project-pedo-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pedo-frontend-service
spec:
  selector:
    app: pedo-frontend
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer